<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" role="img" aria-labelledby="t d"><title id="t">关系数据来源链教学示意</title><desc id="d">按正文R5例，S3 letter1和S4 copy1为两份同源陈述C5和C11，共指寄信实例R5。参加关系另作二模表与共同事件投影。手工结构示意，不是程序输出。</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="#333"/></marker></defs><style>text{font:18px sans-serif}rect{fill:#f6f6f6;stroke:#444}.s{font-size:15px}</style><text x="25" y="28">手工结构示意 非运行输出</text><rect x="25" y="65" width="190" height="105"/><text x="40" y="100">S3 / letter1</text><text x="40" y="135">S4 / copy1</text><text x="40" y="158" class="s">同源组 G3</text><path d="M215 115H280" stroke="#333" marker-end="url(#a)"/><rect x="285" y="65" width="170" height="105"/><text x="300" y="105">C5 与 C11</text><text x="300" y="138" class="s">两条材料陈述</text><path d="M455 115H520" stroke="#333" marker-end="url(#a)"/><rect x="525" y="65" width="170" height="105"/><text x="540" y="105">R5</text><text x="540" y="138" class="s">一个寄信实例</text><path d="M695 115H760" stroke="#333" marker-end="url(#a)"/><rect x="765" y="65" width="300" height="105"/><text x="785" y="105">P1 → P2 寄信层</text><text x="785" y="138" class="s">关联 V2，不制造反向寄信</text><text x="25" y="225">参加层 R3、R4 → 人—事件二模表 → 共同V1投影</text><text x="25" y="265" class="s">派生边必须保留事件、实例、陈述、来源位置。投影不等于相识证据。</text><text x="25" y="300" class="s">来源：正文16.4表及新编 assertions.csv、sources.json。非真实史事。</text></svg>