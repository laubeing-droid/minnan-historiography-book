<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" role="img" aria-labelledby="t d"><title id="t">八人联系存在图教学示意</title><desc id="d">A B C形成三角形，C经D连接D E F三角形，F连接G，H在X0名册内孤立。各边标明寄信事件编号，AB来自T01和T09。手工绘制，不是计算输出。</desc><style>text{font:18px sans-serif}.e{stroke:#444;stroke-width:2}.n{fill:white;stroke:#222;stroke-width:2}.small{font-size:15px}</style><text x="25" y="30">1701—1705 年无向联系存在图 手工示意 非运行输出</text><path class="e" fill="none" d="M100 110V300L300 205Z M300 205H520L720 110V300L520 205 M720 300H920"/><text x="42" y="205" class="small">T01/T09</text><text x="180" y="142" class="small">T03</text><text x="180" y="280" class="small">T02</text><text x="380" y="190" class="small">T04</text><text x="600" y="140" class="small">T05</text><text x="600" y="285" class="small">T07</text><text x="735" y="210" class="small">T06</text><text x="800" y="285" class="small">T08</text><circle class="n" cx="100" cy="110" r="25"/><circle class="n" cx="100" cy="300" r="25"/><circle class="n" cx="300" cy="205" r="25"/><circle class="n" cx="520" cy="205" r="25"/><circle class="n" cx="720" cy="110" r="25"/><circle class="n" cx="720" cy="300" r="25"/><circle class="n" cx="920" cy="300" r="25"/><circle class="n" cx="920" cy="110" r="25"/><g text-anchor="middle"><text x="100" y="116">A</text><text x="100" y="306">B</text><text x="300" y="211">C</text><text x="520" y="211">D</text><text x="720" y="116">E</text><text x="720" y="306">F</text><text x="920" y="306">G</text><text x="920" y="116">H</text></g><text x="25" y="380" class="small">任一方向有确认寄信即连一条无向存在边；箭头和次数在事件表保留。</text><text x="25" y="415" class="small">H依据X0/roster1保留。图上间距不代表地理距离、交往强度或权力。</text><text x="25" y="450" class="small">来源：正文17.1给定事件表与新编events.csv、sources.json；全部为合成教学对象。</text></svg>